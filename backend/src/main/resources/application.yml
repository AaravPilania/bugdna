server:
  port: 8080

spring:
  application:
    name: bugdna-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bugdna?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:bugdna}
    password: ${DB_PASSWORD:CHANGE_ME_LOCAL_ONLY}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET @bugdna_actor = 'API'"
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

bugdna:
  auth:
    dev-user: ${BUGDNA_DEV_USER:dev}
    dev-password: ${BUGDNA_DEV_PASSWORD:password123}
  cors:
    allowed-origins: ${BUGDNA_CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
  ai:
    provider: ${AI_PROVIDER:mock}
    model: ${AI_MODEL:gemini-2.5-flash}
    gemini-key: ${GEMINI_API_KEY:}
    openai-key: ${OPENAI_API_KEY:}

