services:
  mysql:
    image: mysql:8.4
    container_name: bugdna-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_local_only
      MYSQL_DATABASE: bugdna
      MYSQL_USER: bugdna
      MYSQL_PASSWORD: CHANGE_ME_LOCAL_ONLY
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --log-bin-trust-function-creators=1
    volumes:
      - bugdna_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "bugdna", "-pCHANGE_ME_LOCAL_ONLY"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bugdna_mysql_data:

